<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Académico Interactivo</title>
    <style>
        /* Variables de color */
        :root {
            --bg-color: #0d1322;
            --card-bg: #151d30;
            --accent: #22c55e;
            --accent-hover: #16a34a;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --danger: #ef4444;
            --border: #2a364f;
        }

        body.theme-purple { --accent: #c084fc; --accent-hover: #9333ea; }
        body.theme-pink { --accent: #f472b6; --accent-hover: #db2777; }
        body.theme-blue { --accent: #38bdf8; --accent-hover: #0284c7; }
        body.theme-green { --accent: #22c55e; --accent-hover: #16a34a; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }

        /* Topbar */
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 25px; background-color: var(--card-bg);
            border-bottom: 1px solid var(--border); position: relative; z-index: 1000;
        }
        .topbar-left { display: flex; align-items: center; gap: 15px; position: relative; }

        .btn-menu-materias {
            background-color: var(--accent); color: #000; font-weight: bold;
            font-size: 0.95rem; border: none; padding: 10px 16px; border-radius: 8px;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .btn-menu-materias:hover { background-color: var(--accent-hover); color: #fff; }

        .dropdown-materias {
            position: absolute; top: calc(100% + 8px); left: 0; width: 320px;
            background-color: #111827; border: 1px solid var(--border);
            border-radius: 12px; padding: 18px; display: none; flex-direction: column;
            gap: 15px; box-shadow: 0 15px 30px rgba(0,0,0,0.8); z-index: 9999;
        }

        .dropdown-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .dropdown-header h2 { font-size: 1.1rem; color: var(--accent); }

        .subject-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; }
        .subject-item {
            padding: 10px 12px; background-color: var(--card-bg); border-radius: 8px;
            cursor: pointer; border: 1px solid var(--border); transition: all 0.2s ease;
            display: flex; justify-content: space-between; align-items: center;
        }
        .subject-item:hover, .subject-item.active { border-color: var(--accent); background-color: #1e293b; }

        .btn {
            background-color: var(--accent); color: #000; border: none; padding: 9px 14px;
            border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; text-align: center;
        }
        .btn:hover { background-color: var(--accent-hover); color: #fff; }

        .btn-secondary {
            background-color: #1e293b; color: var(--text-main); border: 1px solid var(--border);
            padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer;
        }
        .btn-secondary:hover { background-color: #334155; }
        .btn-danger { background-color: transparent; color: var(--danger); border: none; cursor: pointer; font-size: 1rem; }

        .btn-status { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; border: none; cursor: pointer; }
        .btn-status.completed { background-color: var(--accent); color: #000; }
        .btn-status.pending { background-color: var(--danger); color: #fff; }

        .theme-selector { display: flex; flex-direction: column; gap: 5px; }
        .theme-selector label { font-size: 0.8rem; color: var(--text-sub); }
        .backup-section { border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }

        /* Main Content */
        .main-content { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 25px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }

        .card {
            background-color: var(--card-bg); border-radius: 12px; padding: 20px;
            border: 1px solid var(--border); display: flex; flex-direction: column; gap: 15px; height: fit-content;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .card-header h3 { color: var(--accent); display: flex; align-items: center; gap: 8px; }

        .panel-toggle-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 1rem; }
        .panel-body-container { display: flex; flex-direction: column; gap: 15px; }
        .panel-body-container.collapsed { display: none; }

        .unit-group, .collapsible-section {
            background-color: #0d1322; border: 1px solid var(--border);
            border-radius: 8px; padding: 12px; margin-bottom: 10px;
        }
        .unit-header, .collapsible-header {
            font-size: 0.95rem; color: var(--accent); font-weight: bold;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .unit-content, .collapsible-body { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
        .unit-content.collapsed, .collapsible-body.collapsed { display: none; }

        .item-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .item-card {
            background-color: #151d30; padding: 10px 12px; border-radius: 6px;
            display: flex; justify-content: space-between; align-items: center;
            border-left: 4px solid var(--accent); gap: 10px;
        }
        .item-card.exam { border-left-color: var(--danger); }
        .item-info { display: flex; flex-direction: column; gap: 2px; }
        .item-actions { display: flex; align-items: center; gap: 8px; }

        .resource-section { display: flex; flex-direction: column; gap: 10px; }
        .file-item {
            background-color: #151d30; padding: 8px 12px; border-radius: 6px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border);
        }
        .file-item a { color: var(--text-main); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }
        .file-item a:hover { color: var(--accent); }

        .empty-state { color: var(--text-sub); font-size: 0.9rem; text-align: center; padding: 10px; }

        /* Modales */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); display: none;
            justify-content: center; align-items: center; z-index: 10000;
        }
        .modal-content {
            background-color: var(--card-bg); border: 1px solid var(--border);
            border-radius: 12px; padding: 25px; width: 100%; max-width: 480px;
            display: flex; flex-direction: column; gap: 15px; max-height: 90vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; }

        form { display: flex; flex-direction: column; gap: 12px; }
        input, select {
            background-color: #0d1322; border: 1px solid var(--border);
            color: var(--text-main); padding: 10px; border-radius: 6px; outline: none;
        }
        input:focus, select:focus { border-color: var(--accent); }

        .grade-row { display: flex; gap: 8px; align-items: center; }
        .grade-row input[type="text"] { flex: 2; }
        .grade-row input[type="number"] { flex: 1; }
    </style>
</head>
<body class="theme-green">

    <div class="topbar">
        <div class="topbar-left">
            <button class="btn-menu-materias" id="btnMaterias" onclick="toggleMateriasDropdown(event)">
                ☰ Materias
            </button>

            <div class="dropdown-materias" id="dropdownMaterias" onclick="event.stopPropagation()">
                <div class="dropdown-header">
                    <h2>Mis Materias</h2>
                    <button class="btn-danger" onclick="closeMateriasDropdown()">✕</button>
                </div>

                <div class="theme-selector">
                    <label for="themeSelect">Color de la página:</label>
                    <select id="themeSelect" onchange="changeTheme(this.value)">
                        <option value="theme-green">Verde</option>
                        <option value="theme-blue">Azul</option>
                        <option value="theme-purple">Morado</option>
                        <option value="theme-pink">Rosado</option>
                    </select>
                </div>

                <button class="btn" onclick="openSubjectModal()">+ Agregar Nueva Materia</button>
                <ul class="subject-list" id="subjectList"></ul>

                <div class="backup-section">
                    <button class="btn-secondary" style="width: 100%;" onclick="exportData()">💾 Exportar Copia</button>
                    <button class="btn-secondary" style="width: 100%;" onclick="document.getElementById('importFile').click()">📂 Cargar Copia</button>
                    <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(event)">
                </div>
            </div>

            <div>
                <h1 id="selectedSubjectTitle" style="font-size: 1.3rem;">Selecciona una materia</h1>
                <p id="subjectSubtitle" style="color: var(--text-sub); font-size: 0.85rem;">Presiona '☰ Materias' para comenzar</p>
            </div>
        </div>

        <div>
            <button id="calcGradeBtn" class="btn" style="display: none;" onclick="openGradeModal()">📊 Calcular Promedio</button>
            <a id="classroomLinkBtn" href="#" target="_blank" class="btn-secondary" style="display: none; text-decoration: none; color: var(--accent);">
                Ir a Google Classroom
            </a>
        </div>
    </div>

    <div class="main-content">
        <div class="grid-container" id="dashboard" style="display: none;">
            
            <div class="card">
                <div class="card-header">
                    <h3>
                        <button class="panel-toggle-btn" onclick="toggleCardPanel('tasksCardBody', 'tasksCardArrow')">
                            <span id="tasksCardArrow">▼</span>
                        </button>
                        Tareas y Parciales
                    </h3>
                    <button class="btn" onclick="openTaskModal()">+ Agregar Actividad</button>
                </div>
                <div id="tasksCardBody" class="panel-body-container">
                    <div id="unitContainer"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>
                        <button class="panel-toggle-btn" onclick="toggleCardPanel('resourcesCardBody', 'resourcesCardArrow')">
                            <span id="resourcesCardArrow">▼</span>
                        </button>
                        Recursos y Documentos
                    </h3>
                    <button class="btn-secondary" onclick="openCreateResourceUnitModal()">+ Crear Unidad</button>
                </div>
                
                <div id="resourcesCardBody" class="panel-body-container">
                    <div class="resource-section">
                        <div class="collapsible-section">
                            <div class="collapsible-header" onclick="toggleCollapse('fileSectionBody', 'fileArrow')">
                                <span>📁 Subir Nuevo Archivo</span>
                                <span id="fileArrow">►</span>
                            </div>
                            <div id="fileSectionBody" class="collapsible-body collapsed">
                                <input type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx,.txt" onchange="handleFileSelect(event)">
                                <input type="text" id="customFileName" placeholder="Nombre del archivo (opcional)">
                                <label style="font-size: 0.8rem; color: var(--text-sub);">Asignar a unidad:</label>
                                <select id="fileUnitSelect"></select>
                                <button class="btn-secondary" onclick="uploadSelectedFile()">⬆ Guardar Archivo</button>
                            </div>
                        </div>

                        <div class="collapsible-section">
                            <div class="collapsible-header" onclick="toggleCollapse('linkSectionBody', 'linkArrow')">
                                <span>🔗 Agregar Nuevo Enlace / URL</span>
                                <span id="linkArrow">►</span>
                            </div>
                            <div id="linkSectionBody" class="collapsible-body collapsed">
                                <form id="linkForm" onsubmit="saveWebLink(event)" style="gap: 8px;">
                                    <input type="text" id="linkTitle" placeholder="Nombre del sitio o recurso" required>
                                    <input type="url" id="linkUrl" placeholder="https://..." required>
                                    <label style="font-size: 0.8rem; color: var(--text-sub);">Asignar a unidad:</label>
                                    <select id="linkUnitSelect"></select>
                                    <button type="submit" class="btn-secondary">🔗 Guardar Enlace</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    
                    <h4 style="margin-top: 10px;">Recursos Organizados por Unidad</h4>
                    <div id="resourceUnitContainer"></div>
                </div>
            </div>

        </div>
    </div>

    <div class="modal-overlay" id="subjectModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Agregar Nueva Materia</h3>
                <button class="btn-danger" onclick="closeSubjectModal()">✕</button>
            </div>
            <form id="subjectForm">
                <input type="text" id="subjectName" placeholder="Nombre de la materia" required>
                <input type="url" id="classroomUrl" placeholder="Link de Google Classroom (Opcional)">
                <button type="submit" class="btn">Guardar Materia</button
