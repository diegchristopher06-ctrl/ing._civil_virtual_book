<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Académico Móvil</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --text: #f8fafc;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* --- BOTONES DE CONTROL DE PANELES --- */
    .toggle-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      z-index: 10;
    }

    .toggle-btn:active {
      opacity: 0.8;
    }

    /* --- 1. DRAWER / BARRA LATERAL DE MATERIAS --- */
    .sidebar-drawer {
      position: fixed;
      top: 0;
      left: -280px; /* Oculto por defecto en móvil */
      width: 280px;
      height: 100%;
      background-color: var(--bg-card);
      border-right: 1px solid var(--border);
      transition: left 0.3s ease;
      z-index: 100;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .sidebar-drawer.open {
      left: 0; /* Deslizar hacia la derecha para mostrar */
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      z-index: 90;
    }

    .overlay.active {
      display: block;
    }

    .subject-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .subject-btn {
      width: 100%;
      text-align: left;
      padding: 12px;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
    }

    /* --- 2. ÁREA PRINCIPAL --- */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    header {
      padding: 12px 16px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 12px;
      gap: 12px;
    }

    /* --- 3. PANELES COLAPSABLES (DOCUMENTOS Y TAREAS) --- */
    .collapsible-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .panel-header {
      padding: 14px 16px;
      background: #111827;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .panel-header h3 {
      font-size: 0.95rem;
    }

    .arrow-icon {
      transition: transform 0.3s ease;
    }

    /* Estado colapsado */
    .collapsible-panel.collapsed .panel-body {
      display: none;
    }

    .collapsible-panel.collapsed .arrow-icon {
      transform: rotate(-90deg);
    }

    .panel-body {
      padding: 16px;
      font-size: 0.9rem;
    }

    /* Estilos para pantallas grandes (Escritorio) */
    @media (min-width: 768px) {
      .sidebar-drawer {
        position: relative;
        left: 0;
      }
      .menu-toggle {
        display: none; /* Ocultar botón de menú en PC */
      }
      .overlay {
        display: none !important;
      }
      .content-area {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: start;
      }
    }
  </style>
</head>
<body>

  <!-- FONDO OSCURO PARA MÓVIL AL ABRIR LA BARRA -->
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <!-- BARRA LATERAL DESLIZABLE (MATERIAS) -->
  <aside class="sidebar-drawer" id="sidebar">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>Materias</h2>
      <button class="toggle-btn" onclick="toggleSidebar()">✕</button>
    </div>
    <ul class="subject-list">
      <li><button class="subject-btn">Álgebra Lineal</button></li>
      <li><button class="subject-btn">Cálculo Vectorial</button></li>
      <li><button class="subject-btn">Física General</button></li>
    </ul>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="main-wrapper">
    <header>
      <!-- BOTÓN MENÚ CON LÍNEAS (HAMBURGUESA) -->
      <button class="toggle-btn menu-toggle" onclick="toggleSidebar()">
        ☰ Materias
      </button>
      <h2 style="font-size: 1.1rem;">Álgebra Lineal</h2>
    </header>

    <main class="content-area">
      
      <!-- SECCIÓN DOCUMENTOS (COLAPSABLE) -->
      <section class="collapsible-panel" id="panel-docs">
        <div class="panel-header" onclick="togglePanel('panel-docs')">
          <h3>📄 Documentos y Recursos</h3>
          <span class="arrow-icon">▼</span>
        </div>
        <div class="panel-body">
          <p>- Guía_de_ejercicios_1.pdf</p>
          <p>- Lectura_Sistemas_Lineales.pdf</p>
        </div>
      </section>

      <!-- SECCIÓN TAREAS Y EXÁMENES (COLAPSABLE) -->
      <section class="collapsible-panel" id="panel-tasks">
        <div class="panel-header" onclick="togglePanel('panel-tasks')">
          <h3>📝 Tareas y Exámenes</h3>
          <span class="arrow-icon">▼</span>
        </div>
        <div class="panel-body">
          <p>- Tarea 1: Matrices (Entrega: 10 Sep)</p>
          <p>- Parcial 1 (Fecha: 25 Sep)</p>
        </div>
      </section>

    </main>
  </div>

  <script>
    // Controlar apertura/cierre de la barra lateral de materias
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    }

    // Controlar colapso/despliegue de los paneles
    function togglePanel(panelId) {
      const panel = document.getElementById(panelId);
      panel.classList.toggle('collapsed');
    }
  </script>
</body>
</html>
