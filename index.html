<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Académico Interactivo</title>
    <style>
        /* Variables por defecto (Tema Verde) */
        :root {
            --bg-color: #0d1322;
            --card-bg: #151d30;
            --accent: #22c55e;
            --accent-hover: #16a34a;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --danger: #ef4444;
            --border: #2a364f;
        }

        /* Temas de Color */
        body.theme-purple {
            --accent: #c084fc;
            --accent-hover: #9333ea;
        }

        body.theme-pink {
            --accent: #f472b6;
            --accent-hover: #db2777;
        }

        body.theme-blue {
            --accent: #38bdf8;
            --accent-hover: #0284c7;
        }

        body.theme-green {
            --accent: #22c55e;
            --accent-hover: #16a34a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Topbar / Barra Superior */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 25px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: relative;
            z-index: 1000;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        /* Botón ☰ Materias (Esquina Superior Izquierda) */
        .btn-menu-materias {
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            font-size: 0.95rem;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }

        .btn-menu-materias:hover {
            background-color: var(--accent-hover);
            color: #fff;
        }

        /* Menú Desplegable de Materias hacia abajo */
        .dropdown-materias {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            width: 320px;
            background-color: #111827;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            display: none; /* Oculto por defecto mediante JS */
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
            z-index: 9999;
        }

        .dropdown-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .dropdown-header h2 {
            font-size: 1.1rem;
            color: var(--accent);
        }

        .subject-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
        }

        .subject-item {
            padding: 10px 12px;
            background-color: var(--card-bg);
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .subject-item:hover, .subject-item.active {
            border-color: var(--accent);
            background-color: #1e293b;
        }

        .btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            color: #fff;
        }

        .btn-secondary {
            background-color: #1e293b;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-secondary:hover {
            background-color: #334155;
        }

        .btn-danger {
            background-color: transparent;
            color: var(--danger);
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .btn-status.completed {
            background-color: var(--accent);
            color: #000;
        }

        .btn-status.pending {
            background-color: var(--danger);
            color: #fff;
        }

        .theme-selector {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .theme-selector label {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .backup-section {
            border-top: 1px solid var(--border);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Contenido Principal */
        .main-content {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: fit-content;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .card-header h3 {
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-toggle-btn {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 1rem;
        }

        .panel-body-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel-body-container.collapsed {
            display: none;
        }

        .unit-group, .collapsible-section {
            background-color: #0d1322;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .unit-header, .collapsible-header {
            font-size: 0.95rem;
            color: var(--accent);
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .unit-content, .collapsible-body {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .unit-content.collapsed, .collapsible-body.collapsed {
            display: none;
        }

        .item-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .item-card {
            background-color: #151d30;
            padding: 10px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--accent);
            gap: 10px;
        }

        .item-card.exam {
            border-left-color: var(--danger);
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .item-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .resource-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-preview-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-item {
            background-color: #0d1322;
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
        }

        .file-item a {
            color: var(--text-main);
            text-decoration: none;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 220px;
        }

        .file-item a:hover {
            color: var(--accent);
        }

        .empty-state {
            color: var(--text-sub);
            font-size: 0.9rem;
            text-align: center;
            padding: 10px;
        }

        /* Ventanas Modales */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input, select {
            background-color: #0d1322;
            border: 1px solid var(--border);
            color: var(--text
